name: Simulator checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python3 -m compileall -q web/browser web/tools web/tests
      - name: Install JavaScript dependencies
        run: npm ci --prefix web
      - name: Run simulator unit tests
        run: |
          python3 web/tests/test-resolve-build-target.py
          python3 web/tests/test-trigger-pr.py
          node web/tests/test-demo-data.mjs
          python3 web/tests/test-inspector.py
          node web/tests/test-build-provenance.mjs
      - name: Install browser build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libffi-dev libreadline-dev
      - uses: actions/checkout@v4
        with:
          repository: cryptoadvance/specter-diy
          ref: master
          path: specter-diy
          submodules: recursive
          persist-credentials: false
      - name: Install Emscripten 3.1.74
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.74
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.74
      - name: Build the real Specter DIY WebAssembly runtime
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          SPECTER_SRC="$GITHUB_WORKSPACE/specter-diy" \
            SIMULATOR_REPOSITORY=cryptoadvance/specter-diy-web-simulator \
            SIMULATOR_COMMIT="$(git rev-parse HEAD)" \
            bash web/browser/build-browser.sh
          python3 web/browser/verify_build.py
      - name: Install Chromium for browser UI tests
        run: npx --prefix web playwright install --with-deps chromium
      - name: Test inspector UI and current real firmware runtime
        run: |
          python3 -m http.server 8765 --directory web >/tmp/specter-runtime-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          CI=true TEST_BASE_URL=http://127.0.0.1:8765/ node web/tests/test-inspector.mjs
          CI=true TEST_BASE_URL=http://127.0.0.1:8765/ node web/tests/test-network-policy.mjs
          CI=true TEST_BASE_URL=http://127.0.0.1:8765/ node web/tests/test-site.mjs
