name: Specter PR preview

run-name: >-
  Specter PR ${{ inputs.pr_number }} · ${{ inputs.head_sha }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request ID from the paired Specter DIY workflow
        type: string
        required: true
      action:
        description: Build or remove the PR preview
        type: choice
        options: [build, delete]
        required: true
      base_repository:
        description: Paired base repository (owner/specter-diy)
        type: string
        required: true
      base_sha:
        description: Exact PR base commit used for the trusted JavaScript runtime
        type: string
        required: true
      base_ref:
        description: PR base branch name
        type: string
        required: true
      pr_number:
        description: Pull request number
        type: string
        required: true
      head_repository:
        description: Exact PR source repository (owner/specter-diy)
        type: string
        required: false
      head_sha:
        description: Exact PR source commit SHA
        type: string
        required: true
      head_ref:
        description: PR source branch name
        type: string
        required: false
      source_updated_at:
        description: PR updated_at timestamp from the source event
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate paired Specter PR request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      request_id: ${{ steps.validate.outputs.request_id }}
      action: ${{ steps.validate.outputs.action }}
      base_repository: ${{ steps.validate.outputs.base_repository }}
      base_sha: ${{ steps.validate.outputs.base_sha }}
      base_ref: ${{ steps.validate.outputs.base_ref }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      head_repository: ${{ steps.validate.outputs.head_repository }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      head_ref: ${{ steps.validate.outputs.head_ref }}
      source_updated_at: ${{ steps.validate.outputs.source_updated_at }}
    steps:
      - name: Check out trusted Web Simulator workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned commit
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate event metadata against the live PR
        id: validate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PREVIEW_INPUTS_JSON: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 web/tools/validate_preview_request.py

  build:
    name: Build PR firmware and browser payload
    needs: validate
    if: needs.validate.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: preview-build-${{ github.repository }}-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      firmware_url: ${{ steps.firmware.outputs.artifact-url }}
    env:
      BASE_REPOSITORY: ${{ needs.validate.outputs.base_repository }}
      BASE_SHA: ${{ needs.validate.outputs.base_sha }}
      BASE_REF: ${{ needs.validate.outputs.base_ref }}
      HEAD_REPOSITORY: ${{ needs.validate.outputs.head_repository }}
      HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
      PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
      REQUEST_ID: ${{ needs.validate.outputs.request_id }}
      SOURCE_UPDATED_AT: ${{ needs.validate.outputs.source_updated_at }}
      SIMULATOR_REPOSITORY: ${{ github.repository }}
      SIMULATOR_SHA: ${{ github.sha }}
      SPECTER_SOURCE_DIR: ${{ github.workspace }}/specter-diy
      SIMULATOR_DIR: ${{ github.workspace }}/simulator
      SIMULATOR_WEB_DIR: ${{ github.workspace }}/simulator/web
      FIRMWARE_ARTIFACT_DIR: ${{ github.workspace }}/firmware-artifact
      BROWSER_ARCHIVE: ${{ github.workspace }}/browser-preview-payload.tar.gz
    steps:
      - name: Check out pinned Web Simulator tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned commit
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: simulator
          persist-credentials: false
      - name: Check out exact Specter PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned commit
        with:
          repository: ${{ needs.validate.outputs.head_repository }}
          ref: ${{ needs.validate.outputs.head_sha }}
          path: specter-diy
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Write trusted browser manifest for the source check
        run: python3 simulator/web/browser/write-browser-manifest.py "$SPECTER_SOURCE_DIR"
      - name: Check the PR browser manifest in the untrusted build job
        run: python3 simulator/web/tests/test-browser-manifest.py "$SPECTER_SOURCE_DIR"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install firmware build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libgmp-dev \
            libreadline-dev \
            libsdl2-dev \
            pkg-config \
            python3
          python3 -m pip install --upgrade pip
          python3 -m pip install -r specter-diy/requirements.txt -r specter-diy/test/integration/requirements.txt
      - name: Run Specter native firmware tests
        working-directory: specter-diy
        run: |
          python3 test/run_native_tests.py
          python3 -m compileall src test
          make test
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
      - name: Build Specter firmware from the verified source SHA
        working-directory: specter-diy
        run: nix develop -c make disco
      - name: Record and stage firmware provenance
        run: python3 simulator/web/tools/record_firmware.py
      - name: Install Emscripten 3.1.74
        run: |
          mkdir -p simulator/.browser-work
          git init simulator/.browser-work/emsdk
          git -C simulator/.browser-work/emsdk remote add origin https://github.com/emscripten-core/emsdk.git
          git -C simulator/.browser-work/emsdk fetch --depth 1 origin refs/tags/3.1.74
          git -C simulator/.browser-work/emsdk checkout --detach FETCH_HEAD
          test "$(git -C simulator/.browser-work/emsdk rev-parse HEAD)" = "$(cat simulator/.preview-config/emsdk-commit)"
          simulator/.browser-work/emsdk/emsdk install 3.1.74
          simulator/.browser-work/emsdk/emsdk activate 3.1.74
      - name: Build browser simulator from the same exact Specter SHA
        env:
          SPECTER_SRC: ${{ github.workspace }}/specter-diy
          SPECTER_SOURCE_REPOSITORY: ${{ needs.validate.outputs.head_repository }}
          SIMULATOR_REPOSITORY: ${{ github.repository }}
          SIMULATOR_COMMIT: ${{ github.sha }}
        run: bash simulator/web/browser/build-browser.sh
      - name: Package allowlisted browser output
        run: python3 simulator/web/tools/package_browser.py
      - name: Upload browser build payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-preview-payload
          path: browser-preview-payload.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Upload firmware artifact
        id: firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specter-firmware
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30

  trusted_runtime:
    name: Build trusted JavaScript runtime from the PR base
    needs: validate
    if: needs.validate.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: preview-runtime-${{ github.repository }}-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      BASE_REPOSITORY: ${{ needs.validate.outputs.base_repository }}
      BASE_SHA: ${{ needs.validate.outputs.base_sha }}
      BASE_REF: ${{ needs.validate.outputs.base_ref }}
      SIMULATOR_REPOSITORY: ${{ github.repository }}
      SIMULATOR_SHA: ${{ github.sha }}
      SIMULATOR_COMMIT: ${{ github.sha }}
      SPECTER_SRC: ${{ github.workspace }}/specter-diy
      SIMULATOR_WEB_DIR: ${{ github.workspace }}/simulator/web
      TRUSTED_RUNTIME_DIR: ${{ github.workspace }}/trusted-runtime-artifact
    steps:
      - name: Check out pinned trusted Web Simulator tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned commit
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: simulator
          persist-credentials: false
      - name: Check out exact validated PR base source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned commit
        with:
          repository: ${{ needs.validate.outputs.base_repository }}
          ref: ${{ needs.validate.outputs.base_sha }}
          path: specter-diy
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Set up Node.js for Emscripten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install trusted browser build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libgmp-dev \
            libreadline-dev \
            libsdl2-dev \
            pkg-config \
            python3
      - name: Install pinned Emscripten 3.1.74
        run: |
          mkdir -p simulator/.browser-work
          git init simulator/.browser-work/emsdk
          git -C simulator/.browser-work/emsdk remote add origin https://github.com/emscripten-core/emsdk.git
          git -C simulator/.browser-work/emsdk fetch --depth 1 origin refs/tags/3.1.74
          git -C simulator/.browser-work/emsdk checkout --detach FETCH_HEAD
          test "$(git -C simulator/.browser-work/emsdk rev-parse HEAD)" = "$(cat simulator/.preview-config/emsdk-commit)"
          simulator/.browser-work/emsdk/emsdk install 3.1.74
          simulator/.browser-work/emsdk/emsdk activate 3.1.74
      # The untrusted firmware build's `make disco` freezes src/git_info.py
      # with HEAD_SHA. Recreate that generated module using only the base's
      # trusted generator so Emscripten's JS and the PR WASM share one layout.
      - name: Recreate trusted frozen source metadata for the validated PR head
        working-directory: specter-diy
        env:
          SPECTER_GIT_COMMIT: ${{ needs.validate.outputs.head_sha }}
        run: python3 tools/embed_git_info.py
      - name: Build trusted JavaScript from the exact validated base SHA
        env:
          SPECTER_SOURCE_REPOSITORY: ${{ needs.validate.outputs.base_repository }}
        run: bash simulator/web/browser/build-browser.sh
      - name: Package the trusted JavaScript runtime with provenance
        run: python3 simulator/web/tools/package_trusted_runtime.py
      - name: Upload trusted JavaScript runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-micropython-runtime
          path: trusted-runtime-artifact/
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify the published preview on a clean runner
    needs: [validate, build, trusted_runtime]
    if: needs.validate.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      BASE_REPOSITORY: ${{ needs.validate.outputs.base_repository }}
      BASE_SHA: ${{ needs.validate.outputs.base_sha }}
      BASE_REF: ${{ needs.validate.outputs.base_ref }}
      HEAD_REPOSITORY: ${{ needs.validate.outputs.head_repository }}
      HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
      HEAD_REF: ${{ needs.validate.outputs.head_ref }}
      PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
      ACTION: ${{ needs.validate.outputs.action }}
      REQUEST_ID: ${{ needs.validate.outputs.request_id }}
      SOURCE_UPDATED_AT: ${{ needs.validate.outputs.source_updated_at }}
      SIMULATOR_REPOSITORY: ${{ github.repository }}
      SIMULATOR_SHA: ${{ github.sha }}
      PAGES_DIR: ${{ github.workspace }}/verification-pages
      TRUSTED_WEB_DIR: ${{ github.workspace }}/simulator/web
      BROWSER_ARCHIVE: ${{ github.workspace }}/browser-artifact/browser-preview-payload.tar.gz
      FIRMWARE_DIR: ${{ github.workspace }}/firmware-artifact
      TRUSTED_RUNTIME_DIR: ${{ github.workspace }}/trusted-runtime-artifact
      BUILD_RESULT: success
      FIRMWARE_URL: ${{ needs.build.outputs.firmware_url }}
      TEST_BASE_URL: http://127.0.0.1:8765/
    steps:
      - name: Check out trusted Web Simulator test and publisher code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned commit
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: simulator
          persist-credentials: false
      - name: Check out pinned Virtual Host compatibility target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          repository: cryptoadvance/specter-virtual-host
          ref: 3cf3ecd58a97da0f2cc4b7586ca33abf02f68372
          path: virtual-host
          persist-credentials: false
      - name: Download browser build payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-preview-payload
          path: browser-artifact
      - name: Download firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: specter-firmware
          path: firmware-artifact
      - name: Download trusted JavaScript runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trusted-micropython-runtime
          path: trusted-runtime-artifact
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 pinned commit
        with:
          go-version: '1.22'
      - name: Install trusted browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libgmp-dev \
            libreadline-dev \
            libsdl2-dev \
            pkg-config \
            python3
          npm ci --prefix simulator/web
          npx --prefix simulator/web playwright install --with-deps chromium firefox webkit
      - name: Compose and validate the exact preview using the trusted publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 simulator/web/tools/publish_preview.py
      - name: Verify the composed browser artifact hashes
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.head_sha }}
          SPECTER_SOURCE_REPOSITORY: ${{ needs.validate.outputs.head_repository }}
          SIMULATOR_COMMIT: ${{ github.sha }}
          SIMULATOR_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -c 'from pathlib import Path; import os; from simulator.web.browser.verify_build import verify; verify(Path(os.environ["PAGES_DIR"]) / "pr" / os.environ["PR_NUMBER"] / os.environ["EXPECTED_SHA"], os.environ["EXPECTED_SHA"], os.environ["SPECTER_SOURCE_REPOSITORY"], os.environ["SIMULATOR_COMMIT"], os.environ["SIMULATOR_REPOSITORY"])'
      - name: Run trusted Web Simulator Python and provenance tests
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.head_sha }}
          SPECTER_SOURCE_REPOSITORY: ${{ needs.validate.outputs.head_repository }}
          SIMULATOR_COMMIT: ${{ github.sha }}
          SIMULATOR_REPOSITORY: ${{ github.repository }}
        run: |
          for test in simulator/web/tests/test-*.py; do
            if [[ "$test" == *test-browser-manifest.py ]]; then
              continue
            fi
            python3 "$test"
          done
      - name: Serve the composed preview for browser and transport tests
        run: |
          python3 -m http.server 8765 --directory "$PAGES_DIR/pr/$PR_NUMBER/$HEAD_SHA" > /tmp/specter-browser.log 2>&1 &
          echo $! > /tmp/specter-browser.pid
          for attempt in $(seq 1 30); do curl --fail --silent "$TEST_BASE_URL" >/dev/null && break; sleep 1; done
      - name: Run browser, compatibility, and network policy tests
        run: |
          CI=true npm run test:browser --prefix simulator/web
          npm run test:provenance --prefix simulator/web
          npm run test:compat --prefix simulator/web
          node simulator/web/tests/test-network-policy.mjs
      - name: Run pinned Virtual Host and USB transport tests
        run: |
          usb_site="$RUNNER_TEMP/specter-usb-preview"
          mkdir -p "$usb_site"
          cp -a "$PAGES_DIR/pr/$PR_NUMBER/$HEAD_SHA/." "$usb_site/"
          cp simulator/web/index.html "$usb_site/index.html"
          python3 -m http.server 8766 --directory "$usb_site" > /tmp/specter-usb-site.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8766/ >/dev/null && break; sleep 1; done
          test "$(git -C virtual-host rev-parse HEAD)" = "$(cat simulator/.preview-config/virtual-host-commit)"
          (cd virtual-host && go test ./...)
          (cd virtual-host && go run . --site http://127.0.0.1:8766/ --no-open) > /tmp/specter-virtual-host.log 2>&1 &
          for attempt in $(seq 1 30); do curl --silent --output /dev/null http://127.0.0.1:8788/ && break; sleep 1; done
          python3 simulator/web/tests/test-usb-vcp.py
          TEST_BASE_URL=http://127.0.0.1:8766/ node simulator/web/tests/test-usb-transport.mjs

  finalize:
    name: Publish immutable preview state and PR result
    needs: [validate, build, trusted_runtime, verify]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: preview-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_ID: ${{ needs.validate.outputs.request_id }}
      ACTION: ${{ needs.validate.outputs.action }}
      BASE_REPOSITORY: ${{ needs.validate.outputs.base_repository }}
      BASE_SHA: ${{ needs.validate.outputs.base_sha }}
      BASE_REF: ${{ needs.validate.outputs.base_ref }}
      PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
      HEAD_REPOSITORY: ${{ needs.validate.outputs.head_repository }}
      HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
      HEAD_REF: ${{ needs.validate.outputs.head_ref }}
      SOURCE_UPDATED_AT: ${{ needs.validate.outputs.source_updated_at }}
      SIMULATOR_REPOSITORY: ${{ github.repository }}
      SIMULATOR_SHA: ${{ github.sha }}
      PAGES_DIR: ${{ github.workspace }}/pages
      TRUSTED_WEB_DIR: ${{ github.workspace }}/simulator/web
      BROWSER_ARCHIVE: ${{ github.workspace }}/browser-artifact/browser-preview-payload.tar.gz
      FIRMWARE_DIR: ${{ github.workspace }}/firmware-artifact
      TRUSTED_RUNTIME_DIR: ${{ github.workspace }}/trusted-runtime-artifact
      BUILD_RESULT: ${{ inputs.action == 'delete' && 'deleted' || (needs.build.result == 'success' && needs.trusted_runtime.result == 'success' && needs.verify.result == 'success') && 'success' || (needs.build.result == 'cancelled' || needs.trusted_runtime.result == 'cancelled' || needs.verify.result == 'cancelled') && 'cancelled' || 'failure' }}
      FIRMWARE_URL: ${{ needs.build.outputs.firmware_url }}
    steps:
      - name: Check out trusted publisher implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned commit
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out trusted Web Simulator static shell and publisher tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned commit
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: simulator
          persist-credentials: false
      - name: Download browser artifact data
        if: needs.build.result == 'success' && needs.validate.outputs.action == 'build'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-preview-payload
          path: browser-artifact
      - name: Download firmware artifact data
        if: needs.build.result == 'success' && needs.validate.outputs.action == 'build'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: specter-firmware
          path: firmware-artifact
      - name: Download trusted JavaScript runtime
        if: needs.build.result == 'success' && needs.trusted_runtime.result == 'success' && needs.validate.outputs.action == 'build'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trusted-micropython-runtime
          path: trusted-runtime-artifact
      - name: Prepare persistent Pages branch
        run: |
          gh auth setup-git
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code "$remote" refs/heads/gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$remote" pages
          else
            git clone --no-checkout "$remote" pages
            git -C pages switch --orphan gh-pages
            git -C pages rm -rf . 2>/dev/null || true
            git -C pages clean -fdx
          fi
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply validated result to the persistent Pages tree
        id: publish
        run: python3 simulator/web/tools/publish_preview.py
      - name: Commit and update GitHub Pages source tree
        if: steps.publish.outcome == 'success'
        run: |
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "Update PR $PR_NUMBER preview state"
            git -C pages push origin gh-pages
          fi
      - name: Stage the complete public Pages tree without private state
        if: steps.publish.outcome == 'success'
        run: python3 simulator/web/tools/stage_pages_site.py pages pages-site
      - name: Upload static Pages artifact
        if: steps.publish.outcome == 'success'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages-site
      - name: Deploy Web Simulator Pages
        if: steps.publish.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Create a short-lived Specter PR comment token
        if: needs.validate.outputs.base_repository == 'cryptoadvance/specter-diy' && steps.publish.outputs.applied == 'true' && steps.deployment.outcome == 'success'
        id: specter-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SPECTER_PREVIEW_APP_ID }}
          private-key: ${{ secrets.SPECTER_PREVIEW_APP_PRIVATE_KEY }}
          owner: cryptoadvance
          repositories: specter-diy
          permission-pull-requests: write
      - name: Revalidate and repost the single Specter PR preview comment
        id: report
        if: needs.validate.outputs.base_repository == 'cryptoadvance/specter-diy' && steps.publish.outputs.applied == 'true' && steps.deployment.outcome == 'success'
        env:
          REQUEST_ID: ${{ needs.validate.outputs.request_id }}
          ACTION: ${{ needs.validate.outputs.action }}
          BASE_REPOSITORY: ${{ needs.validate.outputs.base_repository }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          BASE_REF: ${{ needs.validate.outputs.base_ref }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          HEAD_REPOSITORY: ${{ needs.validate.outputs.head_repository }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          HEAD_REF: ${{ needs.validate.outputs.head_ref }}
          SOURCE_UPDATED_AT: ${{ needs.validate.outputs.source_updated_at }}
          SIMULATOR_REPOSITORY: ${{ github.repository }}
          SIMULATOR_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ steps.publish.outputs.status }}
          PAGES_DIR: ${{ github.workspace }}/pages
          SPECTER_PREVIEW_APP_TOKEN: ${{ steps.specter-app-token.outputs.token }}
          SPECTER_PREVIEW_APP_SLUG: ${{ steps.specter-app-token.outputs.app-slug }}
        run: python3 simulator/web/tools/report_preview.py
      - name: Add finalization result to the workflow summary
        if: always()
        run: |
          printf 'Request: `%s`\n' "$REQUEST_ID" >> "$GITHUB_STEP_SUMMARY"
          printf 'Action: `%s`\n' "$ACTION" >> "$GITHUB_STEP_SUMMARY"
          printf 'Build job: `%s`\n' '${{ needs.build.result }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'Trusted runtime job: `%s`\n' '${{ needs.trusted_runtime.result }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'Trusted verification job: `%s`\n' '${{ needs.verify.result }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'Publication result: `%s`\n' '${{ steps.publish.outputs.status }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'PR comment report: `%s`\n' '${{ steps.report.outcome }}' >> "$GITHUB_STEP_SUMMARY"
